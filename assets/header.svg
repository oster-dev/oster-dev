<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Nico Ostermann, Data and Feature Infrastructure Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <style>
      .name { font: 700 58px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; animation: rise 1.2s ease-out both; }
      .role { font: 500 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffd9db; animation: rise 1.2s ease-out 0.4s both; }
      .dot { fill: #ffffff; opacity: 0.1; animation: twinkle 4s ease-in-out infinite; }
      .d2 { animation-delay: 1s; }
      .d3 { animation-delay: 2s; }
      .d4 { animation-delay: 3s; }
      @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
      @keyframes twinkle { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.85; } }
    </style>
  </defs>
  <rect width="1000" height="240" rx="12" fill="url(#bg)"/>
  <circle class="dot" cx="120" cy="60" r="3"/>
  <circle class="dot d2" cx="260" cy="190" r="2.5"/>
  <circle class="dot d3" cx="410" cy="40" r="2"/>
  <circle class="dot d4" cx="620" cy="200" r="3"/>
  <circle class="dot" cx="780" cy="55" r="2.5"/>
  <circle class="dot d2" cx="900" cy="170" r="3"/>
  <circle class="dot d3" cx="70" cy="180" r="2"/>
  <circle class="dot d4" cx="930" cy="45" r="2"/>
  <text class="name" x="500" y="118" text-anchor="middle">Nico Ostermann</text>
  <text class="role" x="500" y="162" text-anchor="middle">Data &amp; Feature Infrastructure Engineer</text>
</svg>
