<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="FeatureForge data flow: Kafka events, generic Flink job, Redis, online client. Iceberg and Cassandra are planned.">
<defs><style>
.tag{font:700 11px 'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:3px;fill:#ff5a64}
.title{font:700 18px 'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#ffffff}
.desc{font:500 13px 'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#9a9aa8}
.plan{font:600 13px 'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#8b8b99}
.dash{animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
</style></defs>
<rect width="1200" height="270" rx="20" fill="#0a0a0f"/>
<line x1="250.0" y1="104.0" x2="343.3" y2="104.0" stroke="#E50914" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 6" class="dash"/>
<circle r="5" fill="#ff4d5a"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite" path="M250.0 104.0 L343.3 104.0"/></circle>
<circle r="5" fill="#ff4d5a" opacity="0.5"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M250.0 104.0 L343.3 104.0"/></circle>
<line x1="553.3" y1="104.0" x2="646.7" y2="104.0" stroke="#E50914" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 6" class="dash"/>
<circle r="5" fill="#ff4d5a"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M553.3 104.0 L646.7 104.0"/></circle>
<circle r="5" fill="#ff4d5a" opacity="0.5"><animateMotion dur="2.4s" begin="2.0s" repeatCount="indefinite" path="M553.3 104.0 L646.7 104.0"/></circle>
<line x1="856.7" y1="104.0" x2="950.0" y2="104.0" stroke="#E50914" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 6" class="dash"/>
<circle r="5" fill="#ff4d5a"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M856.7 104.0 L950.0 104.0"/></circle>
<circle r="5" fill="#ff4d5a" opacity="0.5"><animateMotion dur="2.4s" begin="2.8s" repeatCount="indefinite" path="M856.7 104.0 L950.0 104.0"/></circle>
<rect x="40.0" y="56" width="210" height="96" rx="14" fill="#101017" stroke="#ffffff" stroke-opacity="0.12"/>
<rect x="40.0" y="56" width="4" height="96" rx="2" fill="#E50914"/>
<text x="62.0" y="84" class="tag">SOURCE</text>
<text x="62.0" y="111" class="title">Kafka events</text>
<text x="62.0" y="132" class="desc">validated interaction events</text>
<rect x="343.3" y="56" width="210" height="96" rx="14" fill="#101017" stroke="#ffffff" stroke-opacity="0.12"/>
<rect x="343.3" y="56" width="4" height="96" rx="2" fill="#E50914"/>
<text x="365.3" y="84" class="tag">COMPUTE</text>
<text x="365.3" y="111" class="title">Generic Flink job</text>
<text x="365.3" y="132" class="desc">built from a YAML spec</text>
<rect x="646.7" y="56" width="210" height="96" rx="14" fill="#101017" stroke="#ffffff" stroke-opacity="0.12"/>
<rect x="646.7" y="56" width="4" height="96" rx="2" fill="#E50914"/>
<text x="668.7" y="84" class="tag">ONLINE STORE</text>
<text x="668.7" y="111" class="title">Redis</text>
<text x="668.7" y="132" class="desc">guarded writes</text>
<rect x="950.0" y="56" width="210" height="96" rx="14" fill="#101017" stroke="#ffffff" stroke-opacity="0.12"/>
<rect x="950.0" y="56" width="4" height="96" rx="2" fill="#E50914"/>
<text x="972.0" y="84" class="tag">SERVING</text>
<text x="972.0" y="111" class="title">Online client</text>
<text x="972.0" y="132" class="desc">batch and streaming reads</text>
<line x1="448.3" y1="152" x2="448.3" y2="186" stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="4 5"/>
<rect x="343.3" y="186" width="210" height="44" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="5 5"/>
<text x="448.3" y="213" text-anchor="middle" class="plan">Iceberg · planned</text>
<line x1="751.7" y1="152" x2="751.7" y2="186" stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="4 5"/>
<rect x="646.7" y="186" width="210" height="44" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="5 5"/>
<text x="751.7" y="213" text-anchor="middle" class="plan">Cassandra · planned</text>
</svg>
