<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="t d" height="500" role="img" viewBox="0 0 1200 500" width="1200">
  <title id="t">FeatureForge data flow</title>
  <desc id="d">A YAML spec drives one generic Flink job and a Spark backfill. Kafka events pass a validation job, the Flink job and a guarded materializer into Redis or Cassandra behind one store contract, and a feature service returns a status for every value. The materializer appends a publication history in Iceberg, an event writer stores event facts in Iceberg, and a Spark dataset builder writes training datasets in two modes. Local build on Docker Compose with synthetic data.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .lbl{font-size:9.5px;font-weight:700;letter-spacing:2px}
    .ttl{font-size:15px;font-weight:700;fill:#f2f2f3}
    .ttl.dim{fill:#a9a9b1}
    .sub{font-size:10.5px;fill:#8b8b93}
    .edge{font-size:10px;fill:#8b8b93;font-style:italic}
    .foot{font-size:10.5px;fill:#6e6e76}
    .flow{fill:none;stroke:#E50914;stroke-width:1.6;stroke-dasharray:5 6;animation:run 1.2s linear infinite}
    .soft{fill:none;stroke:#5a1a1e;stroke-width:1.4;stroke-dasharray:3 5}
    @keyframes run{to{stroke-dashoffset:-22}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
